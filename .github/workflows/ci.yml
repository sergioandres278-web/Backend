name: CI

on:
  push:
    branches:
      - ci/add-ci
      - integration/dev-to-pre-review
  pull_request:
    branches:
      - integration/dev-to-pre-review

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agencia_viajes
          MYSQL_USER: agencia_api
          MYSQL_PASSWORD: AgenciaApi2026!
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and test
        run: ./mvnw -DskipTests=false test
