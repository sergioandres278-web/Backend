spring.config.activate.on-profile=test

# Puerto independiente para pruebas E2E (8085 por defecto)
server.port=${PORT:8085}

# Base de datos aislada obligatoria para pruebas E2E
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agencia_viajes_test}
spring.datasource.username=${DB_USERNAME:agencia_api}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Claves JWT de prueba aisladas
agencytrip.jwt.secret=${JWT_SECRET:ABCDEFGHIJKLMNOPQRSTUVWXYZ123456}
agencytrip.jwt.issuer=${JWT_ISSUER:test-issuer}
agencytrip.jwt.audience=${JWT_AUDIENCE:test-audience}