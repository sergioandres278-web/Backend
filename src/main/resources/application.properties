spring.application.name=agencytrip-api

# Los perfiles se cargan desde una ubicación explícita fuera de la ruta estándar.
spring.config.import=optional:classpath:/,optional:classpath:/environments/application-dev.properties,optional:classpath:/environments/application-pre.properties,optional:classpath:/environments/application-prod.properties,optional:classpath:/environments/application-test.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agencia_viajes}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Los secretos se suministran exclusivamente mediante el entorno.
agencytrip.jwt.secret=${JWT_SECRET:}
agencytrip.jwt.issuer=${JWT_ISSUER:AgencyTripAPI}
agencytrip.jwt.audience=${JWT_AUDIENCE:AgencyTripAngular}

# Configuración OAuth Facebook (Graph API v21.0)
agencytrip.oauth.facebook.app-id=${FACEBOOK_APP_ID:}
agencytrip.oauth.facebook.app-secret=${FACEBOOK_APP_SECRET:}
agencytrip.oauth.facebook.graph-version=${FACEBOOK_GRAPH_VERSION:v21.0}
agencytrip.oauth.facebook.graph-base-url=${FACEBOOK_GRAPH_BASE_URL:https://graph.facebook.com}
